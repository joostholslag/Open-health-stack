# ============================================================================
# EXAMPLE Secrets — DO NOT COMMIT REAL VALUES.
# ----------------------------------------------------------------------------
# NOTE: on Hetzner you do NOT need this file. Terraform generates every password
# (random_password in terraform/envs/hetzner/main.tf), passes them to the chart
# with secrets.create=true, and the chart renders these Secrets itself. Retrieve
# them with:  terraform output -json credentials | jq
#
# This file is for standalone installs (no Terraform). The chart references these
# Secrets by NAME and does not create them when secrets.create=false. Create them
# out-of-band before installing:
#
#   cp charts/health-stack/secrets.example.yaml charts/health-stack/secrets.yaml
#   # edit real values, then:
#   kubectl create namespace health-stack   # if not already created
#   kubectl apply -n health-stack -f charts/health-stack/secrets.yaml
#
# In production create them via a secret manager / sealed-secrets / External
# Secrets instead of a plaintext file.
#
# (For local/dev only, `-f values-dev.yaml` sets secrets.create=true and renders
# placeholder credentials, so you can skip this file on kind.)
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: health-stack
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: CHANGE-ME
  EHRBASE_USER: ehrbase_restricted
  EHRBASE_PASSWORD: CHANGE-ME
  EHRBASE_USER_ADMIN: ehrbase
  EHRBASE_PASSWORD_ADMIN: CHANGE-ME
---
apiVersion: v1
kind: Secret
metadata:
  name: ehrbase-secret
  namespace: health-stack
type: Opaque
stringData:
  SECURITY_AUTHTYPE: BASIC
  # Basic-auth EHRbase enforces on its REST API (public at /ehrbase). MUST match
  # what the interceptor uses — the chart renders both from these same values.
  SECURITY_AUTHUSER: ehrbase-user
  SECURITY_AUTHPASSWORD: CHANGE-ME-generate-with-openssl-rand-base64-24
  DB_USER: ehrbase_restricted
  DB_PASS: CHANGE-ME          # = postgres-secret.EHRBASE_PASSWORD
  DB_USER_ADMIN: ehrbase
  DB_PASS_ADMIN: CHANGE-ME    # = postgres-secret.EHRBASE_PASSWORD_ADMIN
  SERVER_NODENAME: local.ehrbase.org
---
apiVersion: v1
kind: Secret
metadata:
  name: hapi-secret
  namespace: health-stack
type: Opaque
stringData:
  HAPI_DB_USER: hapi
  HAPI_DB_PASS: CHANGE-ME     # init-db.sql creates the role with this value
  # No OPENFHIR_OAUTH_* keys: the in-cluster engine is unauthenticated, and the
  # interceptor only attempts a token request when token-url + client-id +
  # client-secret are ALL non-blank. Setting them here (even as placeholders)
  # makes every store fail with "Token request failed ... invalid_client".
---
apiVersion: v1
kind: Secret
metadata:
  name: openfhir-secret
  namespace: health-stack
type: Opaque
stringData:
  OPENFHIR_DB_USER: openfhir
  OPENFHIR_DB_PASS: CHANGE-ME # init-db.sql creates the role with this value
---
# Vendor-provided openFHIR license (local engine only). Populate from the
# emailed openfhir-license.json:
#   kubectl create secret generic openfhir-license -n health-stack \
#     --from-file=openfhir-license.json=./docker/openfhir/license/openfhir-license.json
apiVersion: v1
kind: Secret
metadata:
  name: openfhir-license
  namespace: health-stack
type: Opaque
stringData:
  openfhir-license.json: |
    { "REPLACE": "with the vendor-provided openFHIR license JSON" }
