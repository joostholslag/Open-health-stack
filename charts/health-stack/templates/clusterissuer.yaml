{{- /*
Optional cert-manager ClusterIssuer (Let's Encrypt HTTP-01 via ingress-nginx).
Off by default because Terraform's k8s-apps module can create it, and because
a ClusterIssuer is cluster-scoped (not namespaced) — one per cluster is enough.
Enable with clusterIssuer.create=true for a self-contained `helm install`.
Requires cert-manager already installed in the cluster.
*/ -}}
{{- if .Values.clusterIssuer.create }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.clusterIssuer.name }}
  labels:
    {{- include "health-stack.labels" . | nindent 4 }}
spec:
  acme:
    server: {{ .Values.clusterIssuer.server }}
    email: {{ .Values.clusterIssuer.email }}
    privateKeySecretRef:
      name: {{ .Values.clusterIssuer.name }}-account-key
    solvers:
      - http01:
          ingress:
            class: {{ .Values.clusterIssuer.ingressClass }}
{{- end }}
