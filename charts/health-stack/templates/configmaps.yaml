{{/*
ConfigMaps generated from the files in config/ (kept in sync with docker/). This
whole rendered template is hashed by the checksum/config annotation on each pod
(see _helpers.tpl → health-stack.configChecksum), which reproduces Kustomize's
"roll pods when config changes" behavior without relying on name-suffix hashing.

Three of these files carry credentials, so they are rendered from *.tpl with
__PLACEHOLDER__ tokens replaced from .Values.secrets.values and shipped as
SECRETS rather than ConfigMaps:

  - application.yml → hapi-config Secret  (interceptor's hapi-svc OAuth client secret,
                                           openfhir.oauth2 block)
  - cdrs.yml    → hapi-cdrs Secret       (interceptor's hapi-svc OAuth client secret)
  - init-db.sql → postgres-init-sql Secret (CREATE USER ... PASSWORD)

(The Keycloak realm import is a fourth such file — rendered in keycloak.yaml,
with its own checksum/realm annotation on the keycloak pod.)

Credential-free config stays in plain ConfigMaps — openfhir-application.yaml
is still rendered from a .tpl (the issuer needs __DOMAIN__), but contains no
secret. ehrbase-gateway-config (nginx.conf + authz.rego, for the OPA-backed
PEP sidecar in the ehrbase Pod — see templates/ehrbase.yaml) needs no
substitution at all, so it ships verbatim.
*/}}
{{- $v := .Values.secrets.values -}}
apiVersion: v1
kind: Secret
metadata:
  name: hapi-config
  labels:
    {{- include "health-stack.componentLabels" (dict "ctx" . "name" "hapi") | nindent 4 }}
type: Opaque
stringData:
  application.yml: |-
{{ .Files.Get "config/application.yml.tpl"
     | replace "__KC_HAPI_SVC_SECRET__" (required "secrets.values.keycloak.HAPI_SVC_SECRET is required" $v.keycloak.HAPI_SVC_SECRET)
     | indent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: hapi-cdrs
  labels:
    {{- include "health-stack.componentLabels" (dict "ctx" . "name" "hapi") | nindent 4 }}
type: Opaque
stringData:
  cdrs.yml: |-
{{ .Files.Get "config/cdrs.yml.tpl"
     | replace "__KC_HAPI_SVC_SECRET__" (required "secrets.values.keycloak.HAPI_SVC_SECRET is required" $v.keycloak.HAPI_SVC_SECRET)
     | indent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-init-sql
  labels:
    {{- include "health-stack.componentLabels" (dict "ctx" . "name" "postgres") | nindent 4 }}
type: Opaque
stringData:
  init-db.sql: |-
{{ .Files.Get "config/init-db.sql.tpl"
     | replace "__HAPI_DB_PASS__" (required "secrets.values.hapi.HAPI_DB_PASS is required" $v.hapi.HAPI_DB_PASS)
     | replace "__OPENFHIR_DB_PASS__" (required "secrets.values.openfhir.OPENFHIR_DB_PASS is required" $v.openfhir.OPENFHIR_DB_PASS)
     | replace "__KEYCLOAK_DB_PASS__" (required "secrets.values.keycloak.KC_DB_PASSWORD is required" $v.keycloak.KC_DB_PASSWORD)
     | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openfhir-config
  labels:
    {{- include "health-stack.componentLabels" (dict "ctx" . "name" "openfhir") | nindent 4 }}
data:
  application.yaml: |-
{{ .Files.Get "config/openfhir-application.yaml.tpl"
     | replace "__DOMAIN__" .Values.ingress.host
     | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ehrbase-gateway-config
  labels:
    {{- include "health-stack.componentLabels" (dict "ctx" . "name" "ehrbase") | nindent 4 }}
data:
  nginx.conf: |-
{{ .Files.Get "config/ehrbase-gateway-nginx.conf" | indent 4 }}
  authz.rego: |-
{{ .Files.Get "config/ehrbase-gateway-authz.rego" | indent 4 }}
