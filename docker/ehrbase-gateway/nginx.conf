# EHRbase-fronting PEP (Policy Enforcement Point).
#
# Takes over the `ehrbase` DNS name on the health-stack network so every
# existing caller — nginx's own /ehrbase location, HAPI's cdrs.yml, and the
# openFHIR engine's CDR connection — reaches this gateway transparently,
# with ZERO config changes to any of them. The real EHRbase container moves
# to the `ehrbase-backend` service name.
#
# Needs OpenResty (not stock nginx): nginx's auth_request module treats any
# 2xx from the sub-request as "allow", but OPA's decision API always answers
# 200 with a JSON body ({"result": true|false}) — a plain auth_request can't
# branch on that body. access_by_lua_block calls OPA and inspects the result
# itself, which is the standard nginx+OPA integration pattern.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 32m;

    lua_package_path "/usr/local/openresty/lualib/?.lua;;";

    server {
        listen 8080;

        # Unauthenticated management probe (EHRbase's own MANAGEMENT_* env
        # already makes this public) — lets compose/k8s healthchecks work
        # without needing OPA up first, same public shape as talking to
        # EHRbase directly.
        location = /ehrbase/management/health {
            set $upstream_ehrbase_backend ehrbase-backend;
            proxy_pass http://$upstream_ehrbase_backend:8080;
        }

        location / {
            access_by_lua_block {
                local http = require "resty.http"
                local cjson = require "cjson"
                local httpc = http.new()
                httpc:set_timeout(2000)

                local body = cjson.encode({
                    input = {
                        method = ngx.var.request_method,
                        path   = ngx.var.uri,
                        token  = ngx.var.http_authorization or "",
                    },
                })

                local res, err = httpc:request_uri(
                    "http://opa:8181/v1/data/ehrbase/authz/allow",
                    {
                        method = "POST",
                        body = body,
                        headers = { ["Content-Type"] = "application/json" },
                    }
                )

                if not res then
                    ngx.log(ngx.ERR, "ehrbase-gateway: OPA request failed: ", err)
                    return ngx.exit(503)
                end

                if res.status ~= 200 then
                    ngx.log(ngx.ERR, "ehrbase-gateway: OPA returned HTTP ", res.status)
                    return ngx.exit(503)
                end

                local ok, decision = pcall(cjson.decode, res.body)
                if not ok or decision.result ~= true then
                    -- 401 (no credentials) vs 403 (credentials present but
                    -- insufficient) — matches EHRbase's own native check, so
                    -- callers see the same status they'd get talking to
                    -- EHRbase directly (see scripts/smoke.sh's auth matrix,
                    -- which asserts bare requests get 401).
                    if not ngx.var.http_authorization then
                        return ngx.exit(401)
                    end
                    return ngx.exit(403)
                end
            }

            set $upstream_ehrbase_backend ehrbase-backend;
            proxy_pass http://$upstream_ehrbase_backend:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }
    }
}
