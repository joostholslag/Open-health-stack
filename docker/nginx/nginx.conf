# freshehr reverse proxy (compose layer only — k8s uses ingress-nginx instead).
#
# Routing table (mirrored by the health-stack Helm chart's ingress template):
#   /fhir         → hapi:8080      edge auth: auth_request → oauth2-proxy
#   /ehrbase      → ehrbase:8080   NO edge auth — EHRbase validates natively
#   /openfhir     → openfhir:8080  NO edge auth — engine validates natively
#   /terminology  → hades:8080     edge auth: auth_request → oauth2-proxy (+ prefix strip)
#   /auth         → keycloak:8080  public (token/discovery endpoints, admin console)
#
# The auth split mirrors the k8s Ingress objects 1:1: nginx `auth_request` here
# becomes an ingress-nginx `auth-url` annotation on /fhir, while /ehrbase and
# /openfhir deliberately carry no edge auth in either layer (double-gating a
# native resource server adds failure modes for no benefit).
#
# TLS uses self-signed dev certs mounted from ./certs (see README openssl
# one-liner). Plain :80 redirects to :443.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS. `resolver` + variable upstreams let nginx start
    # even when an optional upstream (openfhir) is not running.
    resolver 127.0.0.11 valid=10s ipv6=off;

    sendfile on;
    keepalive_timeout 65;

    # Preserve large FHIR/openEHR payloads (IPS bundles, OPTs).
    client_max_body_size 32m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # ── HTTP :80 → redirect to HTTPS ────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS :443 — reverse proxy ──────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Internal auth_request target: oauth2-proxy validates the Bearer token
        # (signature, issuer, aud=oauth2-proxy) and answers 202 or 401.
        location = /oauth2/auth {
            internal;
            set $upstream_oauth2 oauth2-proxy;
            proxy_pass http://$upstream_oauth2:4180;
            # Subrequests must be bodiless. NOTE: proxy_set_header here stops
            # inheritance of the http-level headers, so restate what matters.
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Uri   $request_uri;
        }

        # Turn auth_request's bare 401 into a proper Bearer challenge.
        location @unauthorized {
            add_header WWW-Authenticate 'Bearer realm="freshehr"' always;
            return 401;
        }

        # HAPI FHIR API (with the openFHIR interceptor). Edge-authenticated:
        # HAPI itself is wide open, and /fhir is a write path into the CDR.
        location /fhir {
            auth_request /oauth2/auth;
            error_page 401 = @unauthorized;
            set $upstream_hapi hapi;
            proxy_pass http://$upstream_hapi:8080$request_uri;
        }

        # EHRbase openEHR REST API. Deliberately NO auth_request here: EHRbase
        # validates every request natively (mirrors the k8s /ehrbase Ingress).
        # `ehrbase` is no longer the CDR container itself, though — it's an
        # OPA-backed PEP gateway (docker/ehrbase-gateway/) in front of it, so
        # this hop, HAPI's cdrs.yml hop, and openFHIR's own CDR connection all
        # get the same extra policy check transparently.
        location /ehrbase {
            set $upstream_ehrbase ehrbase;
            proxy_pass http://$upstream_ehrbase:8080$request_uri;
        }

        # openFHIR engine. Deliberately NO auth_request: the engine runs as an
        # OAuth2 resource server (openfhir.protected=true) and validates every
        # request natively with per-API scopes — same rationale as /ehrbase
        # (mirrors the k8s /openfhir Ingress). /health and /status stay public
        # (permitAll) inside the engine.
        location /openfhir {
            set $upstream_openfhir openfhir;
            # Strip the /openfhir prefix before proxying to the engine root.
            rewrite ^/openfhir/?(.*)$ /$1 break;
            proxy_pass http://$upstream_openfhir:8080;
        }

        # hades terminology server. Edge-authenticated like /fhir: hades has no
        # application-level auth, and once an operator imports SNOMED CT its
        # license terms preclude serving it openly. Prefix-stripped like
        # /openfhir: hades serves under /fhir/... on its own port, and /fhir at
        # the edge belongs to HAPI — so the public shape is
        # /terminology/fhir/CodeSystem/$lookup etc.
        location /terminology {
            auth_request /oauth2/auth;
            error_page 401 = @unauthorized;
            set $upstream_hades hades;
            rewrite ^/terminology/?(.*)$ /$1 break;
            proxy_pass http://$upstream_hades:8080;
        }

        # Keycloak: public by design — token + OIDC discovery endpoints must be
        # reachable; the admin console has its own login. No rewrite needed:
        # Keycloak serves under /auth itself (KC_HTTP_RELATIVE_PATH).
        location /auth {
            set $upstream_keycloak keycloak;
            proxy_pass http://$upstream_keycloak:8080$request_uri;
        }

        location = / {
            return 200 "freshehr-open-health-stack nginx up. Routes: /fhir /ehrbase /openfhir /terminology /auth\n";
            add_header Content-Type text/plain;
        }
    }
}
