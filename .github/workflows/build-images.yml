# M3 — build & push the custom container images to GHCR (ghcr.io/freshehrteam).
#
#   * ghcr.io/freshehrteam/hapi-openfhir            = official HAPI + the openFHIR
#                                                     interceptor JAR (interceptor
#                                                     built from source here)
#   * ghcr.io/freshehrteam/fhirconnect-eps-mappings = data-only image: the EPS
#                                                     FHIRConnect mappings + OPT,
#                                                     copied into the openFHIR pod
#                                                     by an initContainer
#
# The Helm chart references both via `images.hapi` / `images.ipsMappings`. That
# values key keeps its historical `ips` spelling — renaming it would break existing
# overrides, and it names a chart field, not the registry repository.
#
# No repo secrets needed: pushes authenticate with the workflow's own GITHUB_TOKEN
# (each job requests `packages: write`). ONE-TIME step after the first push: GHCR
# creates packages private, so flip both to Public
# (github.com/orgs/freshehrteam/packages → package → Package settings → Danger
# Zone → Change visibility). Until then every pull fails with "pull access denied"
# even though the workflow is green.
name: build-images

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "docker/hapi/**"
      - "docker/openfhir/bootstrap/**"
      - "docker/openfhir/bootstrap.Dockerfile"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR namespace (must be lowercase); matches the hardcoded pins in the chart,
  # compose, Makefile and scripts.
  IMAGE_ORG: freshehrteam
  # Pin the interceptor source revision for reproducible builds.
  INTERCEPTOR_REPO: https://github.com/openFHIR/openfhir-hapi-interceptor
  INTERCEPTOR_REF: main

jobs:
  hapi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Build the interceptor JAR from source and stage it where the HAPI
      # Dockerfile expects it (docker/hapi/extra-classes/).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build interceptor JAR
        run: |
          git clone --depth 1 --branch "$INTERCEPTOR_REF" "$INTERCEPTOR_REPO" /tmp/interceptor
          cd /tmp/interceptor
          mvn -B clean package -DskipTests
          mkdir -p "$GITHUB_WORKSPACE/docker/hapi/extra-classes"
          cp target/*.jar "$GITHUB_WORKSPACE/docker/hapi/extra-classes/"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/hapi-openfhir
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: docker/hapi
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  eps-mappings:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/fhirconnect-eps-mappings
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: docker/openfhir
          file: docker/openfhir/bootstrap.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
